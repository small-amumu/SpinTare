[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spintare-vllm"
version = "0.1.0"
description = "SpinTare pre-deployment check and postmean repair for low-bit KV caches in vLLM"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.entry-points."vllm.general_plugins"]
spintare = "spintare_vllm:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
